version: '3.8'

services:

  db:
    image: postgres:16-alpine
    container_name: mushuc_runa_db
    env_file:
      - ./Backend/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

  # Broker de EVENTOS (Redis)
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    env_file:
      - ./Backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    volumes:
      - redisdata:/data

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis_insight_ui
    user: "0:0"
    ports:
      - "8001:5540"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    volumes:
      - redisinsight:/data

  # --- Microservicio A (Transacciones) ---
  svc-transacciones:
    build:
      context: ./Backend
      dockerfile: apps/transacciones/Dockerfile
    container_name: svc-transacciones
    env_file:
      - ./Backend/.env
    environment: 
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: TransaccionesBDD
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TCP_PORT: 4003
      TRANSACCIONES_PORT: 5003
    ports:
      - "5003:5003"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # --- Microservicio B (Cuentas) ---
  svc-cuentas:
    build:
      context: ./Backend
      dockerfile: apps/cuentas/Dockerfile
    container_name: svc-cuentas
    env_file:
      - ./Backend/.env
    environment: 
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: CuentasBDD
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TCP_PORT: 4002
      CUENTAS_PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # --- Microservicio C (Clientes / Usuarios) ---
  svc-clientes:
    build:
      context: ./Backend
      dockerfile: apps/clientes/Dockerfile
    container_name: svc-clientes
    env_file:
      - ./Backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: UsuariosBDD
      DB_SYNCHRONIZE: "true"
      DB_LOGGING: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TCP_PORT: 4001
      CLIENTES_PORT: 5001
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # --- API Gateway ---
  gateway:
    build:
      context: ./Backend
      dockerfile: apps/sistema_bancario/Dockerfile
    container_name: gateway
    env_file:
      - ./Backend/.env
    environment:
      SVC_TRANSACCIONES_HOST: svc-transacciones
      SVC_TRANSACCIONES_PORT: 4003
      SVC_TRANSACCIONES_HTTP_PORT: 5003
      SVC_CUENTAS_HOST: svc-cuentas
      SVC_CUENTAS_PORT: 4002
      SVC_CUENTAS_HTTP_PORT: 5002
      SVC_CLIENTES_HOST: svc-clientes
      SVC_CLIENTES_PORT: 4001
      SVC_CLIENTES_HTTP_PORT: 5001
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: 
      - "3000:3000"
    depends_on: 
      - svc-transacciones
      - svc-cuentas
      - svc-clientes
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # --- Frontend ---
  frontend:
    build:
      context: ./cooperativa-mushuc-runa
      dockerfile: Dockerfile
    container_name: frontend_ui
    ports:
      - "8080:8080"
    depends_on:
      - gateway
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
  redisinsight:

