user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Ocultar la versión de Nginx en cabeceras de error
    server_tokens off;

    # Cabeceras globales de seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # Definir los microservicios internos en la red de Docker
    upstream usuarios_service {
        server usuarios-api:8000;
    }

    upstream vehiculos_service {
        server vehiculos-app:3000;
    }

    upstream zonas_service {
        server zonas-app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Tamaño máximo de petición del cliente
        client_max_body_size 10M;

        # Configuración común para reenvío de cabeceras de proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- MAPEO DE SEGURIDAD: USUARIOS (usuarios-api) ---
        # Público: /usuario/crear      -> Interno: /usuarios (POST)
        # Público: /usuario/buscar     -> Interno: /usuarios/buscar (GET)
        # Público: /usuario/actualizar -> Interno: /usuarios/{id} (PATCH)
        # Público: /usuario/roles      -> Interno: /usuarios/{id}/roles (PUT)
        # Público: /usuario/eliminar   -> Interno: /usuarios/{id} (DELETE)
        location = /usuario/crear {
            proxy_pass http://usuarios_service/usuarios;
        }
        location = /usuario/buscar {
            proxy_pass http://usuarios_service/usuarios/buscar;
        }
        location ~ ^/usuario/actualizar/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/$1;
        }
        location ~ ^/usuario/roles/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/$1/roles;
        }
        location ~ ^/usuario/eliminar/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/$1;
        }

        # --- MAPEO DE SEGURIDAD: ROLES (usuarios-api) ---
        # Público: /rol/crear      -> Interno: /roles (POST)
        # Público: /rol/listar     -> Interno: /roles (GET)
        # Público: /rol/obtener    -> Interno: /roles/{id} (GET)
        # Público: /rol/actualizar -> Interno: /roles/{id} (PATCH)
        # Público: /rol/eliminar   -> Interno: /roles/{id} (DELETE)
        location = /rol/crear {
            proxy_pass http://usuarios_service/roles;
        }
        location = /rol/listar {
            proxy_pass http://usuarios_service/roles;
        }
        location ~ ^/rol/obtener/(.*)$ {
            proxy_pass http://usuarios_service/roles/$1;
        }
        location ~ ^/rol/actualizar/(.*)$ {
            proxy_pass http://usuarios_service/roles/$1;
        }
        location ~ ^/rol/eliminar/(.*)$ {
            proxy_pass http://usuarios_service/roles/$1;
        }

        # --- MAPEO DE SEGURIDAD: VEHICULOS (vehiculos-app) ---
        # Público: /vehiculo/crear      -> Interno: /vehiculos (POST)
        # Público: /vehiculo/listar     -> Interno: /vehiculos (GET)
        # Público: /vehiculo/obtener    -> Interno: /vehiculos/{id} (GET)
        # Público: /vehiculo/actualizar -> Interno: /vehiculos/{id} (PATCH)
        # Público: /vehiculo/eliminar   -> Interno: /vehiculos/{id} (DELETE)
        location = /vehiculo/crear {
            proxy_pass http://vehiculos_service/vehiculos;
        }
        location = /vehiculo/listar {
            proxy_pass http://vehiculos_service/vehiculos;
        }
        location ~ ^/vehiculo/obtener/(.*)$ {
            proxy_pass http://vehiculos_service/vehiculos/$1;
        }
        location ~ ^/vehiculo/actualizar/(.*)$ {
            proxy_pass http://vehiculos_service/vehiculos/$1;
        }
        location ~ ^/vehiculo/eliminar/(.*)$ {
            proxy_pass http://vehiculos_service/vehiculos/$1;
        }

        # --- MAPEO DE SEGURIDAD: ZONAS (zonas-app) ---
        # Público: /zona/crear      -> Interno: /api/v1/zonas/ (POST)
        # Público: /zona/actualizar -> Interno: /api/v1/zonas/{id} (PUT)
        # Público: /zona/eliminar   -> Interno: /api/v1/zonas/{id} (DELETE)
        location = /zona/crear {
            proxy_pass http://zonas_service/api/v1/zonas/;
        }
        location ~ ^/zona/actualizar/(.*)$ {
            proxy_pass http://zonas_service/api/v1/zonas/$1;
        }
        location ~ ^/zona/eliminar/(.*)$ {
            proxy_pass http://zonas_service/api/v1/zonas/$1;
        }

        # --- MAPEO DE SEGURIDAD: ESPACIOS (zonas-app) ---
        # Público: /espacio/crear      -> Interno: /api/v1/espacios/ (POST)
        # Público: /espacio/estado     -> Interno: /api/v1/espacios/estado/{estado} (GET)
        # Público: /espacio/cambio     -> Interno: /api/v1/espacios/{id}/estado/{estado} (PUT)
        location = /espacio/crear {
            proxy_pass http://zonas_service/api/v1/espacios/;
        }
        location ~ ^/espacio/estado/([^/]+)/estado/([^/]+)$ {
            proxy_pass http://zonas_service/api/v1/espacios/$1/estado/$2;
        }
        location ~ ^/espacio/estado/([^/]+)$ {
            proxy_pass http://zonas_service/api/v1/espacios/estado/$1;
        }

        # Manejador de error por defecto
        error_page 404 /404.json;
        location = /404.json {
            default_type application/json;
            return 404 '{"error": "Not Found", "message": "El recurso solicitado no existe.", "statusCode": 404}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 502 '{"error": "Bad Gateway", "message": "Error al comunicarse con el microservicio interno.", "statusCode": 502}';
        }
    }
}
