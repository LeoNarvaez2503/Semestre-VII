user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Ocultar la versión de Nginx en cabeceras de error
    server_tokens off;

    # Cabeceras globales de seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # Definir los microservicios internos
    upstream usuarios_service {
        server usuarios-api:8000;
    }

    upstream vehiculos_service {
        server vehiculos-app:3000;
    }

    upstream zonas_service {
        server zonas-app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Tamaño máximo de petición del cliente
        client_max_body_size 10M;

        # --- ENRUTAMIENTO: USUARIOS & ROLES ---
        location /usuarios {
            proxy_pass http://usuarios_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /roles {
            proxy_pass http://usuarios_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- ENRUTAMIENTO: VEHICULOS ---
        location /vehiculos {
            proxy_pass http://vehiculos_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- ENRUTAMIENTO: ZONAS & ESPACIOS ---
        location /api/v1/zonas {
            proxy_pass http://zonas_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/espacios {
            proxy_pass http://zonas_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Manejador de error por defecto
        error_page 404 /404.json;
        location = /404.json {
            default_type application/json;
            return 404 '{"error": "Not Found", "message": "El recurso solicitado no existe.", "statusCode": 404}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 502 '{"error": "Bad Gateway", "message": "Error al comunicarse con el microservicio interno.", "statusCode": 502}';
        }
    }
}
