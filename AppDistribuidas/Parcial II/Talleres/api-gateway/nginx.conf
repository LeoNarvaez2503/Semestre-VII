user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Ocultar la versión de Nginx en cabeceras de error
    server_tokens off;

    # Cabeceras globales de seguridad
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Se relaja el CSP para permitir la carga de Swagger UI (scripts en línea y estilos desde CDNs)
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:;" always;
    add_header Referrer-Policy "no-referrer" always;

    # Definir los microservicios internos en la red de Docker
    upstream usuarios_service {
        server usuarios-api:8000;
    }

    upstream vehiculos_service {
        server vehiculos-app:3000;
    }

    upstream zonas_service {
        server zonas-app:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Tamaño máximo de petición del cliente
        client_max_body_size 10M;

        # Configuración común para reenvío de cabeceras de proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- MAPEO DE SEGURIDAD: USUARIOS (usuarios-api) ---
        # Público: /usuario/crear      -> Interno: /usuarios/crear (POST)
        # Público: /usuario/listar     -> Interno: /usuarios/listar (GET)
        # Público: /usuario/buscar     -> Interno: /usuarios/buscar (GET)
        # Público: /usuario/obtener    -> Interno: /usuarios/obtener/{id} (GET)
        # Público: /usuario/actualizar -> Interno: /usuarios/actualizar/{id} (PATCH)
        # Público: /usuario/roles      -> Interno: /usuarios/roles/{id} (PUT)
        # Público: /usuario/eliminar   -> Interno: /usuarios/eliminar/{id} (DELETE)
        location = /usuario/crear {
            proxy_pass http://usuarios_service/usuarios/crear;
        }
        location = /usuario/listar {
            proxy_pass http://usuarios_service/usuarios/listar;
        }
        location = /usuario/buscar {
            proxy_pass http://usuarios_service/usuarios/buscar;
        }
        location ~ ^/usuario/obtener/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/obtener/$1;
        }
        location ~ ^/usuario/actualizar/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/actualizar/$1;
        }
        location ~ ^/usuario/roles/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/roles/$1;
        }
        location ~ ^/usuario/eliminar/(.*)$ {
            proxy_pass http://usuarios_service/usuarios/eliminar/$1;
        }

        # --- MAPEO DE SEGURIDAD: ROLES (usuarios-api) ---
        # Público: /rol/crear      -> Interno: /roles/crear (POST)
        # Público: /rol/listar     -> Interno: /roles/listar (GET)
        # Público: /rol/obtener    -> Interno: /roles/obtener/{id} (GET)
        # Público: /rol/actualizar -> Interno: /roles/actualizar/{id} (PATCH)
        # Público: /rol/eliminar   -> Interno: /roles/eliminar/{id} (DELETE)
        location = /rol/crear {
            proxy_pass http://usuarios_service/roles/crear;
        }
        location = /rol/listar {
            proxy_pass http://usuarios_service/roles/listar;
        }
        location ~ ^/rol/obtener/(.*)$ {
            proxy_pass http://usuarios_service/roles/obtener/$1;
        }
        location ~ ^/rol/actualizar/(.*)$ {
            proxy_pass http://usuarios_service/roles/actualizar/$1;
        }
        location ~ ^/rol/eliminar/(.*)$ {
            proxy_pass http://usuarios_service/roles/eliminar/$1;
        }

        # --- MAPEO DE SEGURIDAD: VEHICULOS (vehiculos-app) ---
        # Público: /vehiculo/crear      -> Interno: /vehiculos/crear (POST)
        # Público: /vehiculo/listar     -> Interno: /vehiculos/listar (GET)
        # Público: /vehiculo/obtener    -> Interno: /vehiculos/obtener/{id} (GET)
        # Público: /vehiculo/actualizar -> Interno: /vehiculos/actualizar/{id} (PATCH)
        # Público: /vehiculo/eliminar   -> Interno: /vehiculos/eliminar/{id} (DELETE)
        location = /vehiculo/crear {
            proxy_pass http://vehiculos_service/vehiculos/crear;
        }
        location = /vehiculo/listar {
            proxy_pass http://vehiculos_service/vehiculos/listar;
        }
        location ~ ^/vehiculo/obtener/(.*)$ {
            proxy_pass http://vehiculos_service/vehiculos/obtener/$1;
        }
        location ~ ^/vehiculo/actualizar/(.*)$ {
            proxy_pass http://vehiculos_service/vehiculos/actualizar/$1;
        }
        location ~ ^/vehiculo/eliminar/(.*)$ {
            proxy_pass http://vehiculos_service/vehiculos/eliminar/$1;
        }

        # --- MAPEO DE SEGURIDAD: ZONAS (zonas-app) ---
        # Público: /zona/crear      -> Interno: /api/v1/zonas/crear (POST)
        # Público: /zona/listar     -> Interno: /api/v1/zonas/listar (GET)
        # Público: /zona/actualizar -> Interno: /api/v1/zonas/actualizar/{id} (PUT)
        # Público: /zona/eliminar   -> Interno: /api/v1/zonas/eliminar/{id} (DELETE)
        location = /zona/crear {
            proxy_pass http://zonas_service/api/v1/zonas/crear;
        }
        location = /zona/listar {
            proxy_pass http://zonas_service/api/v1/zonas/listar;
        }
        location ~ ^/zona/actualizar/(.*)$ {
            proxy_pass http://zonas_service/api/v1/zonas/actualizar/$1;
        }
        location ~ ^/zona/eliminar/(.*)$ {
            proxy_pass http://zonas_service/api/v1/zonas/eliminar/$1;
        }

        # --- MAPEO DE SEGURIDAD: ESPACIOS (zonas-app) ---
        # Público: /espacio/crear      -> Interno: /api/v1/espacios/crear (POST)
        # Público: /espacio/listar     -> Interno: /api/v1/espacios/listar (GET)
        # Público: /espacio/obtener    -> Interno: /api/v1/espacios/obtener/{id} (GET)
        # Público: /espacio/estado     -> Interno: /api/v1/espacios/estado/{estado} (GET)
        # Público: /espacio/estado/{id}/estado/{e} -> Interno: /api/v1/espacios/{id}/estado/{e} (PUT)
        location = /espacio/crear {
            proxy_pass http://zonas_service/api/v1/espacios/crear;
        }
        location = /espacio/listar {
            proxy_pass http://zonas_service/api/v1/espacios/listar;
        }
        location ~ ^/espacio/obtener/(.*)$ {
            proxy_pass http://zonas_service/api/v1/espacios/obtener/$1;
        }
        location ~ ^/espacio/estado/([^/]+)/estado/([^/]+)$ {
            proxy_pass http://zonas_service/api/v1/espacios/$1/estado/$2;
        }
        location ~ ^/espacio/estado/([^/]+)$ {
            proxy_pass http://zonas_service/api/v1/espacios/estado/$1;
        }

        # --- DOCUMENTACIÓN SWAGGER (usuarios-api) ---
        location /usuarios/docs {
            proxy_pass http://usuarios_service/usuarios/docs;
        }
        location /usuarios/openapi.json {
            proxy_pass http://usuarios_service/usuarios/openapi.json;
        }

        # --- DOCUMENTACIÓN SWAGGER (vehiculos-app) ---
        location /vehiculos/docs/ {
            proxy_pass http://vehiculos_service/vehiculos/docs/;
        }
        location = /vehiculos/docs-json {
            proxy_pass http://vehiculos_service/vehiculos/docs-json;
        }

        # --- DOCUMENTACIÓN SWAGGER (zonas-app) ---
        location = /zonas/docs {
            proxy_pass http://zonas_service/zonas/docs;
        }
        location /zonas/swagger-ui/ {
            proxy_pass http://zonas_service/zonas/swagger-ui/;
        }
        location /zonas/openapi.json {
            proxy_pass http://zonas_service/zonas/openapi.json;
        }

        # Manejador de error por defecto
        error_page 404 /404.json;
        location = /404.json {
            default_type application/json;
            return 404 '{"error": "Not Found", "message": "El recurso solicitado no existe.", "statusCode": 404}';
        }

        error_page 500 502 503 504 /50x.json;
        location = /50x.json {
            default_type application/json;
            return 502 '{"error": "Bad Gateway", "message": "Error al comunicarse con el microservicio interno.", "statusCode": 502}';
        }
    }
}
