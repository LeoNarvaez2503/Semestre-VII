apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: FloresGuamanMoralesNarvaez
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: proxy
      port: 9000
      targetPort: 8000
      nodePort: 30900
    - name: admin
      port: 8001
      targetPort: 8001
