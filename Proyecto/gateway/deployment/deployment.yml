apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: floresguamanmoralesnarvaez
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: kong
          image: api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: proxy
            - containerPort: 8001
              name: admin
          envFrom:
            - configMapRef:
                name: api-gateway-config
          volumeMounts:
            - name: kong-config-volume
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
          readinessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "15m"
            limits:
              memory: "384Mi"
              cpu: "150m"
      volumes:
        - name: kong-config-volume
          configMap:
            name: kong-declarative-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: floresguamanmoralesnarvaez
data:
  kong.yml: |
    _format_version: "3.0"
    plugins:
      - name: response-transformer
        enabled: true
        config:
          add:
            headers:
              - "X-Frame-Options:DENY"
              - "X-Content-Type-Options:nosniff"
              - "X-XSS-Protection:1; mode=block"
              - "Referrer-Policy:no-referrer"
      - name: cors
        enabled: true
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Keep-Alive
            - User-Agent
            - X-Requested-With
            - If-Modified-Since
            - Cache-Control
            - Content-Type
            - Authorization
          credentials: false
    services:
      - name: auth-service
        url: http://auth-service:8000
        routes:
          - name: usuario-login
            paths:
              - /usuario/login
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/login
          - name: usuario-refresh
            paths:
              - /usuario/refresh
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/refresh
          - name: usuario-me
            paths:
              - /usuario/me
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/me
          - name: usuario-me-actualizar
            paths:
              - /usuario/me/actualizar
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/me/actualizar
          - name: usuario-me-vehiculos
            paths:
              - /usuario/me/vehiculos
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/me/vehiculos
          - name: usuario-crear
            paths:
              - /usuario/crear
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/crear
          - name: usuario-listar
            paths:
              - /usuario/listar
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/listar
          - name: usuario-buscar
            paths:
              - /usuario/buscar
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/buscar
          - name: usuario-obtener
            paths:
              - ~/usuario/obtener/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/obtener/$(uri_captures[1])
          - name: usuario-actualizar
            paths:
              - ~/usuario/actualizar/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/actualizar/$(uri_captures[1])
          - name: usuario-roles
            paths:
              - ~/usuario/roles/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/roles/$(uri_captures[1])
          - name: usuario-eliminar
            paths:
              - ~/usuario/eliminar/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /usuarios/eliminar/$(uri_captures[1])
          - name: rol-crear
            paths:
              - /rol/crear
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /roles/crear
          - name: rol-listar
            paths:
              - /rol/listar
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /roles/listar
          - name: rol-obtener
            paths:
              - ~/rol/obtener/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /roles/obtener/$(uri_captures[1])
          - name: rol-actualizar
            paths:
              - ~/rol/actualizar/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /roles/actualizar/$(uri_captures[1])
          - name: rol-eliminar
            paths:
              - ~/rol/eliminar/([^/]+)$
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /roles/eliminar/$(uri_captures[1])
      - name: parking-service
        url: http://parking-service:8080
        routes:
          - name: zona-crear
            paths:
              - /zona/crear
            plugins:
              - name: request-transformer
