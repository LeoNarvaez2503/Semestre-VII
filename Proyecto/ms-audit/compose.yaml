services:
  db:
    image: postgres:15-alpine
    container_name: audit-db
    restart: always
    environment:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
      POSTGRES_DB: audit_db
    ports:
      - "5433:5432"
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U audit_user -d audit_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - audit-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-audit
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    networks:
      - audit-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ms-audit-app
    restart: always
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - RABBITMQ_HOST=rabbitmq
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - audit-net

networks:
  audit-net:
    driver: bridge

volumes:
  audit_pgdata:
