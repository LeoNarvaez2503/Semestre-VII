apiVersion: apps/v1
kind: Deployment
metadata:
  name: asignacion-service
  namespace: floresguamanmoralesnarvaez
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asignacion-service
  template:
    metadata:
      labels:
        app: asignacion-service
    spec:
      containers:
        - name: asignacion-service
          image: asignacion-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: asignacion-service-config
            - secretRef:
                name: asignacion-service-secrets
          readinessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "75m"
