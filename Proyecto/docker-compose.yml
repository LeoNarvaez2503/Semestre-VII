services:
  # --- MICROSERVICIO: USUARIOS ---
  usuarios-db:
    image: postgres:15-alpine
    container_name: usuarios_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: usuarios
    ports:
      - "5431:5432"
    volumes:
      - usuarios_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usuarios"]
      interval: 5s
      timeout: 5s
      retries: 10

  usuarios-api:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: usuarios_api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:admin@usuarios-db:5432/usuarios
      PORT: 8000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.#
    depends_on:
      usuarios-db:
        condition: service_healthy

  # --- MICROSERVICIO: VEHICULOS ---
  vehiculos-db:
    image: postgres:15-alpine
    container_name: vehiculos_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vehiculos_db
    ports:
      - "5432:5432"
    volumes:
      - vehiculos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vehiculos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  vehiculos-app:
    build:
      context: ./vehiculos
      dockerfile: Dockerfile
    container_name: vehiculos_app
    restart: always
    environment:
      PORT: 3000
      DB_HOST: vehiculos-db
      DB_PORT: 5432
      DB_USUARIO: admin
      DB_CONTRASENA: adminpassword
      DB_NOMBRE: vehiculos_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.#
    depends_on:
      vehiculos-db:
        condition: service_healthy

  # --- MICROSERVICIO: ZONAS ---
  zonas-db:
    image: postgres:16-alpine
    container_name: zonas_db
    restart: always
    environment:
      POSTGRES_DB: zonas_db
      POSTGRES_USER: zonas_user
      POSTGRES_PASSWORD: zonas_pass
    ports:
      - "5433:5432"
    volumes:
      - zonas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonas_user -d zonas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  zonas-app:
    build:
      context: ./parking-service
      dockerfile: Dockerfile
    container_name: zonas_app
    restart: always
    environment:
      DB_URL: jdbc:postgresql://zonas-db:5432/zonas_db
      DB_USERNAME: zonas_user
      DB_PASSWORD: zonas_pass
      PORT: 8080
      ZONA_NAME: Zona Principal
      ZONA_CODE: Z001
      ZONA_DESCRIPTION: Zona creada desde Docker Compose
      ZONA_TYPE: REGULAR
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.#
    depends_on:
      zonas-db:
        condition: service_healthy

  # --- MICROSERVICIO: ASIGNACIONES Y TRAZABILIDAD ---
  asignaciones-db:
    image: postgres:15-alpine
    container_name: asignaciones_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: asignaciones_db
    ports:
      - "5434:5432"
    volumes:
      - asignaciones_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d asignaciones_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  asignacion-app:
    build:
      context: ./asignacion-trazabilidad
      dockerfile: Dockerfile
    container_name: asignaciones_app
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DB_HOST: asignaciones-db
      DB_PORT: 5432
      DB_USUARIO: admin
      DB_CONTRASENA: adminpassword
      DB_NOMBRE: asignaciones_db
      USUARIOS_API_URL: http://usuarios-api:8000
      VEHICULOS_API_URL: http://vehiculos-app:3000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.#
    depends_on:
      asignaciones-db:
        condition: service_healthy
      usuarios-api:
        condition: service_started
      vehiculos-app:
        condition: service_started

  # --- API GATEWAY SEGURO ---
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway_seguro
    restart: always
    ports:
      - "9000:8000"
    depends_on:
      usuarios-api:
        condition: service_started
      vehiculos-app:
        condition: service_started
      zonas-app:
        condition: service_started
      asignacion-app:
        condition: service_started
      tickets-api:
        condition: service_started

  # --- MICROSERVICIO: TICKETS ---
  tickets-db:
    image: postgres:15-alpine
    container_name: tickets_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: tickets
    ports:
      - "5435:5432"
    volumes:
      - tickets_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  tickets-api:
    build:
      context: ./ticket-service
      dockerfile: Dockerfile
    container_name: tickets_api
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:admin@tickets-db:5432/tickets
      PORT: 8001
      USUARIOS_API_URL: http://usuarios-api:8000
      VEHICULOS_API_URL: http://vehiculos-app:3000
      ZONAS_API_URL: http://zonas-app:8080
      ASIGNACIONES_API_URL: http://asignacion-app:3001
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_ROUTING_KEY: audit.#
    depends_on:
      tickets-db:
        condition: service_healthy
      usuarios-api:
        condition: service_started
      vehiculos-app:
        condition: service_started
      zonas-app:
        condition: service_started

  # --- RABBITMQ ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-audit
    restart: always
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- MICROSERVICIO AUDITORIA Y NOTIFICACIONES ---
  audit-db:
    image: postgres:15-alpine
    container_name: audit_db
    restart: always
    environment:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
      POSTGRES_DB: audit_db
    ports:
      - "5436:5432"
    volumes:
      - audit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-app:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: audit_app
    restart: always
    ports:
      - "3002:3002"
    environment:
      DB_HOST: audit-db
      DB_PORT: 5432
      DB_USER: audit_user
      DB_PASSWORD: audit_pass
      DB_NAME: audit_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_QUEUE: audit_queue
      RABBITMQ_EXCHANGE: audit_exchange
      RABBITMQ_ROUTING_KEY: audit.#
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100
      PORT: 3002
    depends_on:
      audit-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # --- FRONTEND ANGULAR (CLEAN ARCHITECTURE) ---
  frontend-angular:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: frontend_angular_app
    restart: always
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  usuarios_pgdata:
  vehiculos_pgdata:
  zonas_pgdata:
  asignaciones_pgdata:
  tickets_pgdata:
  audit_pgdata:
