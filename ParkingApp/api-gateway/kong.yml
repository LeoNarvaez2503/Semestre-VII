        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/roles/$(uri_captures[1])
      - name: usuario-eliminar
        paths:
          - ~/usuario/eliminar/([^/]+)$
        methods:
          - DELETE
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/eliminar/$(uri_captures[1])
      - name: rol-crear
        paths:
          - /rol/crear
        methods:
          - POST
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /roles/crear
      - name: rol-listar
        paths:
          - /rol/listar
