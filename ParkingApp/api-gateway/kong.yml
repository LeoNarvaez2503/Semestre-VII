_format_version: "3.0"

plugins:
  - name: response-transformer
    enabled: true
    config:
      add:
        headers:
          - "X-Frame-Options:DENY"
          - "X-Content-Type-Options:nosniff"
          - "X-XSS-Protection:1; mode=block"
          - "Content-Security-Policy:default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data:;"
          - "Referrer-Policy:no-referrer"
  - name: cors
    enabled: true
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Keep-Alive
        - User-Agent
        - X-Requested-With
        - If-Modified-Since
        - Cache-Control
        - Content-Type
        - Authorization
      credentials: true

services:
  - name: usuarios-service
    url: http://usuarios-api:8000
    routes:
      - name: usuario-login
        paths:
          - /usuario/login
        methods:
          - POST
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/login
      - name: usuario-refresh
        paths:
          - /usuario/refresh
        methods:
          - POST
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/refresh
      - name: usuario-me
        paths:
          - /usuario/me
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/me
      - name: usuario-me-actualizar
        paths:
          - /usuario/me/actualizar
        methods:
          - PATCH
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/me/actualizar
      - name: usuario-me-vehiculos
        paths:
          - /usuario/me/vehiculos
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/me/vehiculos
      - name: usuario-crear
        paths:
          - /usuario/crear
        methods:
          - POST
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/crear
      - name: usuario-listar
        paths:
          - /usuario/listar
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/listar
      - name: usuario-buscar
        paths:
          - /usuario/buscar
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/buscar
      - name: usuario-obtener
        paths:
          - ~/usuario/obtener/([^/]+)$
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/obtener/$(uri_captures[1])
      - name: usuario-actualizar
        paths:
          - ~/usuario/actualizar/([^/]+)$
        methods:
          - PATCH
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /usuarios/actualizar/$(uri_captures[1])
      - name: usuario-roles
        paths:
          - ~/usuario/roles/([^/]+)$
        methods:
