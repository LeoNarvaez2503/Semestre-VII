          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /roles/listar
      - name: rol-obtener
        paths:
          - ~/rol/obtener/([^/]+)$
        methods:
          - GET
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /roles/obtener/$(uri_captures[1])
      - name: rol-actualizar
        paths:
          - ~/rol/actualizar/([^/]+)$
        methods:
          - PATCH
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /roles/actualizar/$(uri_captures[1])
      - name: rol-eliminar
        paths:
          - ~/rol/eliminar/([^/]+)$
        methods:
          - DELETE
        plugins:
          - name: request-transformer
            config:
              replace:
                uri: /roles/eliminar/$(uri_captures[1])
      - name: usuarios-docs
        paths:
          - /usuarios/docs
          - /usuarios/openapi.json
        methods:
          - GET
        strip_path: false

