
services:
  db:
    image: postgres:15-alpine
    container_name: vehiculos_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: vehiculos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vehiculos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vehiculos_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USUARIO: admin
      DB_CONTRASENA: adminpassword
      DB_NOMBRE: vehiculos_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
